name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Build/Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/movies-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -q -DskipTests compile
      
     
      # Phase 3: Backend Tests
      - name: Run Backend Unit/Integration Tests
        run: ./mvnw test

  frontend:
    name: Frontend Lint/Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/MovieEnjoy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/MovieEnjoy/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

      # Phase 3: Angular Tests
      - name: Run Frontend Unit/Integration Tests
        run: npm test -- --watch=false
