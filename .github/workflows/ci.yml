name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # formatting and linting
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1


  frontend-format:
    name: Frontend Formatting Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/MovieEnjoy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/MovieEnjoy/package-lock.json
      - run: npm ci
      - name: Run Prettier Check
        run: npx --yes prettier@3 --check "src/**/*.{ts,html,css}" "*.json"

  backend:
    name: Backend Build/Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/movies-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -q -DskipTests compile

      # Run all backend tests including phase4-tagged future-behavior tests
      - name: Run Backend Unit/Integration Tests
        run: ./mvnw -D"junit.tags.exclude=" test

  frontend:
    name: Frontend Lint/Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/MovieEnjoy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/MovieEnjoy/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

      # Phase 3: Angular Tests
      - name: Run Frontend Unit/Integration Tests
        run: npm test -- --watch=false

  e2e:
    name: Frontend E2E (Mock Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/MovieEnjoy/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/MovieEnjoy
        run: npm ci

      - name: Install Playwright Browser
        working-directory: frontend/MovieEnjoy
        run: npx playwright install --with-deps chromium

      - name: Start Backend (mock profile)
        working-directory: backend/movies-backend
        run: |
          chmod +x mvnw
          ./mvnw -q spring-boot:run "-Dspring-boot.run.profiles=mock" "-Dspring-boot.run.arguments=--server.port=8082" > ../../backend.log 2>&1 &
          echo $! > ../../backend.pid

      - name: Wait for Backend
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8082/api/movies?page=1&size=50" > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start in time"
          exit 1

      - name: Start Frontend
        working-directory: frontend/MovieEnjoy
        run: |
          npm start > ../../frontend.log 2>&1 &
          echo $! > ../../frontend.pid

      - name: Wait for Frontend
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:4200/main" > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start in time"
          exit 1

      - name: Run Full E2E Tests
        working-directory: frontend/MovieEnjoy
        run: npm run e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/MovieEnjoy/playwright-report
          if-no-files-found: warn

      - name: Upload Server Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-logs
          path: |
            backend.log
            frontend.log
          if-no-files-found: warn
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/movies-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - name: Run integration tests only
        run: ./mvnw -q -Dtest='*IntegrationTest' test

  stress-robustness-smoke:
    name: Stress/Robustness Smoke (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/MovieEnjoy/package-lock.json
      - uses: grafana/setup-k6-action@v1
      - name: Install frontend dependencies
        working-directory: frontend/MovieEnjoy
        run: npm ci
      - name: Start backend (mock profile)
        working-directory: backend/movies-backend
        run: |
          chmod +x mvnw
          ./mvnw -q spring-boot:run "-Dspring-boot.run.profiles=mock" > ../../backend-k6.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -fsS "http://localhost:8081/api/movies?page=1&size=50" > /dev/null; then
              echo "Backend is ready for k6"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start in time"
          exit 1
      - name: Run k6 smoke test
        working-directory: frontend/MovieEnjoy
        run: BASE_URL=http://localhost:8081 npm run perf:k6:movies:smoke
