<section>
  <p *ngIf="loading">Loading movie...</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div *ngIf="movie" class="card">
    <h2>{{ movie.title }}</h2>
    <p>Year: {{ movie.year }}</p>
    <p>Director: {{ movie.director }}</p>
    <p>Rating: {{ movie.rating ?? 'N/A' }}</p>

    <p>
      <strong>Genres:</strong>
      <span *ngIf="movie.genres.length === 0"> None</span>
      <span *ngFor="let genre of movie.genres; let last = last">
        {{ genre }}<span *ngIf="!last">, </span>
      </span>
    </p>

    <p>
      <strong>Stars:</strong>
      <span *ngIf="stars.length === 0"> None</span>
      <span *ngFor="let star of stars; let last = last">
        <a [routerLink]="['/stars', star.id]">{{ star.name }}</a><span *ngIf="!last">, </span>
      </span>
    </p>

    <div class="add-to-cart-row">
      <div class="quantity-control" aria-label="Quantity">
        <button type="button" (click)="decreaseQuantity()" [disabled]="quantity === 1">-</button>
        <span>{{ quantity }}</span>
        <button type="button" (click)="increaseQuantity()">+</button>
      </div>
      <button type="button" class="add-button" (click)="addToCart(movie.id)">Add to cart</button>
    </div>
  </div>

  <button type="button" routerLink="/movies">Back to list</button>
</section>
