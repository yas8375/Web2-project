<section class="login-theme py-5">
  <div class="container">
    <div class="login-shell p-4 p-md-5">
      <a class="page-back-link" routerLink="/main">&#8592; Back to Home</a>
      <span class="login-kicker">Account</span>
      <h1 class="login-title mb-2">Login</h1>
      <p class="login-subtitle mb-4">Sign in to continue.</p>

      <form (ngSubmit)="onLogin()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            class="form-control"
            [(ngModel)]="email"
            placeholder="name@example.com"
            autocomplete="email"
            required
          >
          <div class="form-text">Example: jbrown@ics185.edu</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            class="form-control"
            [(ngModel)]="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          >
          <div class="form-text">Example: keyboard</div>
        </div>

        <button type="submit" class="login-btn" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          {{ loading ? 'Loading...' : 'Login' }}
        </button>
      </form>

      <p class="login-footer mb-0 mt-4">
        Need an account?
        <a routerLink="/signup">Sign up</a>
      </p>

      <div *ngIf="message" class="alert mt-4 mb-0" [ngClass]="messageType" role="alert">
        {{ message }}
      </div>
    </div>
  </div>
</section>
