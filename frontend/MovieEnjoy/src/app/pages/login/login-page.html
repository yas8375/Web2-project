<!-- Load Bootstrap only on the Login page to avoid affecting other pages. -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  crossorigin="anonymous"
>

<section class="login-page d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-sm border-0" data-bs-theme="dark">
          <div class="card-body p-4">
            <h1 class="h3 mb-2">Login</h1>
            <p class="text-body-secondary mb-4">Sign in to browse movies.</p>

            <form (ngSubmit)="onLogin()" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  id="email"
                  type="email"
                  name="email"
                  class="form-control"
                  [(ngModel)]="email"
                  placeholder="name@example.com"
                  autocomplete="email"
                  required
                >
                <div class="form-text">Example: jbrown@ics185.edu</div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                  id="password"
                  type="password"
                  name="password"
                  class="form-control"
                  [(ngModel)]="password"
                  placeholder="Password"
                  autocomplete="current-password"
                  required
                >
                <div class="form-text">Example: keyboard</div>
              </div>

              <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                {{ loading ? 'Loading...' : 'Login' }}
              </button>
            </form>

            <div *ngIf="message" class="alert mt-3 mb-0" [class]="'alert-' + messageType" role="alert">
              {{ message }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
