<section>
  <a class="page-back-link" routerLink="/main">&#8592; Back to Home</a>
  <h1>Browse by Title</h1>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <div class="title-letters" *ngIf="letters.length > 0">
    <a
      *ngFor="let letter of letters"
      [routerLink]="['/movies']"
      [queryParams]="{ letter: letter }"
      >{{ letter }}</a
    >
  </div>
  <p *ngIf="!errorMessage && letters.length === 0">No titles available.</p>
</section>
