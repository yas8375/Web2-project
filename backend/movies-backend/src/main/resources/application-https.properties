# Phase 6: HTTPS profile (no secrets committed)
# Run with:  SPRING_PROFILES_ACTIVE=https

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:movies-backend}

# Ensure session cookies work with cross-site requests (Angular dev server on 4200/4201)
# Browsers require SameSite=None cookies to also be Secure.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none

